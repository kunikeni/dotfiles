# macOS 固有のセットアップ定義（MISE_ENV=mac で読み込まれる）

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.packages]
# formula
# btop は mise の aqua バックエンドが linux 向けしか提供していない
"brew:btop" = "latest"
"brew:coreutils" = "latest"
"brew:git" = "latest"
"brew:grep" = "latest"
# cask
"brew-cask:claude-code@latest" = "latest"
"brew-cask:codex" = "latest"
"brew-cask:font-hack-nerd-font" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:rancher" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:thebrowsercompany-dia" = "latest"
"brew-cask:visual-studio-code" = "latest"

# mise の brew-cask バックエンドが未対応な cask は brew に直接投げる。
# Microsoft 系と Zoom は pkg installer の choices、gcloud-cli は preflight の copy を使っている
[bootstrap.hooks.post-packages]
run = "brew install --cask gcloud-cli microsoft-auto-update microsoft-excel microsoft-powerpoint microsoft-word windows-app zoom"
